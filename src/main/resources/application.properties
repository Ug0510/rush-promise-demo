spring.application.name=rush-promise
spring.task.scheduling.pool.size=3
spring.datasource.hikari.maximum-pool-size=${RUSH_DB_POOL:8}
spring.datasource.hikari.minimum-idle=${RUSH_DB_IDLE:1}
spring.mvc.problemdetails.enabled=true
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=12MB
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
server.error.include-message=never
server.forward-headers-strategy=framework
rush.staff.token=${RUSH_STAFF_TOKEN:}
rush.owner.token=${RUSH_OWNER_TOKEN:}
rush.operator.token=${RUSH_OPERATOR_TOKEN:}
rush.booking.api-token=${RUSH_BOOKING_API_TOKEN:}
rush.policy.flagsmith-key=${FLAGSMITH_ENVIRONMENT_KEY:}
rush.policy.flagsmith-url=${FLAGSMITH_API_URL:https://edge.api.flagsmith.com/api/v1/flags/}
rush.policy.refresh-ms=${RUSH_POLICY_REFRESH_MS:60000}
