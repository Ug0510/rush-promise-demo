apiVersion: v1
kind: ConfigMap
metadata:
  name: rush-promise-gateway
  namespace: dev-data
data:
  default.conf: |
    limit_req_zone $binary_remote_addr zone=voice:1m rate=2r/s;
    server {
      listen 8080;
      server_tokens off;
      client_max_body_size 8m;
      proxy_http_version 1.1;
      proxy_connect_timeout 3s;
      proxy_read_timeout 25s;
      proxy_set_header Host $host;
      proxy_set_header Forwarded "";
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Port 443;
      proxy_set_header X-Forwarded-Prefix "";
      add_header X-Content-Type-Options nosniff always;
      add_header Permissions-Policy "microphone=(self), camera=()" always;

      location = /caller {
        if ($request_method != GET) { return 405; }
        proxy_pass http://rush-promise-web:8080;
      }
      location = /voice-ui/caller.css {
        if ($request_method != GET) { return 405; }
        proxy_pass http://rush-promise-web:8080;
      }
      location = /voice-ui/caller.js {
        if ($request_method != GET) { return 405; }
        proxy_pass http://rush-promise-web:8080;
      }
      location = /api/storefront/deepak-mithai-bhandar {
        if ($request_method != GET) { return 405; }
        proxy_pass http://rush-promise-web:8080;
      }
      location = /api/storefront/virajs-bakery {
        if ($request_method != GET) { return 405; }
        proxy_pass http://rush-promise-web:8080;
      }
      location = /api/voice/browser/turn {
        if ($request_method != POST) { return 405; }
        limit_req zone=voice burst=5 nodelay;
        proxy_pass http://rush-promise-web:8080;
      }
      location = /api/voice/sarvam/turn {
        if ($request_method != POST) { return 405; }
        limit_req zone=voice burst=5 nodelay;
        proxy_pass http://rush-promise-web:8080;
      }
      location = /webhooks/twilio/status {
        if ($request_method != POST) { return 405; }
        client_max_body_size 32k;
        proxy_pass http://rush-promise-web:8080;
      }
      location / { return 404; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rush-promise-gateway
  namespace: dev-data
spec:
  replicas: 1
  selector:
    matchLabels: {app: rush-promise-gateway}
  template:
    metadata:
      labels: {app: rush-promise-gateway}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: gateway
          image: nginxinc/nginx-unprivileged:1.28-alpine
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            tcpSocket: {port: http}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 200m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /etc/nginx/conf.d, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: rush-promise-gateway}
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: rush-promise-gateway
  namespace: dev-data
spec:
  selector: {app: rush-promise-gateway}
  ports:
    - {name: http, port: 8080, targetPort: http}
